<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Hub</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#eee;font:16px system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#111}
header input{flex:1;max-width:420px;margin:0 auto;padding:10px 14px;border-radius:20px;border:0;background:#222;color:#fff}
header b{flex:1;text-align:center}
.pr{display:flex;gap:6px;align-items:center;font-size:15px}.pr span,.pr i{cursor:pointer;font-style:normal}.pr i{font-size:26px}
main{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;background:#000}
.card{height:100%;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;cursor:pointer;background:linear-gradient(160deg,#16213e,#0f0f1a)}
.card:nth-child(even){background:linear-gradient(160deg,#2b1646,#0f0f1a)}
.card h2{font-size:34px;margin:0 0 10px;word-break:break-word}.card p{opacity:.7}
footer{padding:10px;background:#111;text-align:center}
button{background:#2d2d44;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:16px;cursor:pointer;margin:4px}
button.bl{background:#1e88e5}button.big{background:#6c5ce7;width:100%;margin:6px 0}button.g{background:#333}button.on{background:#00b894}
input,textarea{width:100%;padding:11px;margin:6px 0;border-radius:10px;border:1px solid #444;background:#1c1c28;color:#fff;font:inherit}
textarea{height:160px;font-family:monospace;font-size:13px}label{display:block;margin:6px 0;font-size:14px;opacity:.9}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:5;padding:12px}
#c .ov{z-index:9}.bx{background:#1a1a26;border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
.row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.row button{flex:1}
.er{color:#ff7675;min-height:20px;margin:2px 0}.top{text-align:left}
.pg{padding:20px;max-width:440px;margin:0 auto;width:100%;text-align:center;overflow:auto}.ic{font-size:70px}
.play{position:fixed;inset:0;background:#000;z-index:8}.play iframe{width:100%;height:100%;border:0}
.play button{position:absolute;top:8px;left:8px;z-index:2;opacity:.8}
.it{display:flex;justify-content:space-between;align-items:center;background:#1c1c28;padding:10px 14px;border-radius:12px;margin:8px 0;text-align:left}
.c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
</style></head><body>
<div id="app"></div><div id="m"></div><div id="c"></div>
<script type="module">
/* ===== НАСТРОЙКА ИНТЕРНЕТА (Firebase) — вставь свои данные из консоли Firebase =====
   Пока apiKey пустой, работает демо-режим: всё хранится только в твоём браузере. */
const FIREBASE_CONFIG={apiKey:"AIzaSyBjm4nCx5cSgsIcwEVnrYqgtBQlig9yRU",authDomain:"anim-31532.firebaseapp.com",projectId:"anim-31532",appId:"1:493531691081:web:5b8df554ea2315bb6e2798"};

const ADMIN="klk238038@gmail.com",AS="678849d9725fd80a",AH="cb4e092988312b307ec629515efc43b4d79cfb9c3703ade360848f26a73f0f90"; // пароль админа хранится только как хеш
const $=s=>document.querySelector(s),e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICONS=["😀","😎","🐱","🚀","👾"],app=$("#app");
let B,me,P,G=[],q="",cur,Y,F,BAN;
const adm=()=>me&&me.email.toLowerCase()==ADMIN&&sessionStorage.adm=="1";
async function go(){if(me.email.toLowerCase()==ADMIN&&sessionStorage.adm!="1")return passV();await load();home()}
const hash=async(p,s)=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s+p)))].map(x=>x.toString(16).padStart(2,"0")).join("");

if(FIREBASE_CONFIG.apiKey){
 const V="https://www.gstatic.com/firebasejs/10.12.2/";
 const[A,AU,S]=await Promise.all([import(V+"firebase-app.js"),import(V+"firebase-auth.js"),import(V+"firebase-firestore.js")]);
 const ap=A.initializeApp(FIREBASE_CONFIG),au=AU.getAuth(ap),fs=S.getFirestore(ap);
 B={onAuth:f=>AU.onAuthStateChanged(au,u=>f(u&&{uid:u.uid,email:u.email})),
  login:()=>{const p=new AU.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});return AU.signInWithPopup(au,p).catch(()=>AU.signInWithRedirect(au,p))},
  logout:()=>AU.signOut(au),
  getUser:async id=>{const s=await S.getDoc(S.doc(fs,"users",id));return s.exists()?s.data():null},
  getBan:async id=>{const s=await S.getDoc(S.doc(fs,"bans",id));return s.exists()?s.data():null},setBan:(id,d)=>S.setDoc(S.doc(fs,"bans",id),d),delGame:id=>S.deleteDoc(S.doc(fs,"games",id)),
  setUser:(id,d)=>S.setDoc(S.doc(fs,"users",id),d,{merge:true}),
  games:async()=>(await S.getDocs(S.collection(fs,"games"))).docs.map(d=>({id:d.id,...d.data()})),
  addGame:async g=>(await S.addDoc(S.collection(fs,"games"),g)).id,
  updGame:(id,d)=>S.updateDoc(S.doc(fs,"games",id),d),
  vote:(id,u,v)=>S.updateDoc(S.doc(fs,"games",id),{likes:v>0?S.arrayUnion(u):S.arrayRemove(u),dislikes:v<0?S.arrayUnion(u):S.arrayRemove(u)})};
}else{
 const L=()=>JSON.parse(localStorage.gh||'{"users":{},"games":[],"me":null}'),W=d=>localStorage.gh=JSON.stringify(d);let cb;
 B={onAuth:f=>{cb=f;f(L().me)},
  login:async()=>{const m=prompt("Демо-режим. Введи свою почту Gmail:");if(m){const d=L();d.me={uid:m,email:m};W(d);cb(d.me)}},
  logout:async()=>{const d=L();d.me=null;W(d);cb(null)},
  getUser:async id=>L().users[id]||null,
  getBan:async id=>(L().bans||{})[id]||null,setBan:async(id,x)=>{const d=L();d.bans={...d.bans,[id]:x};W(d)},delGame:async id=>{const d=L();d.games=d.games.filter(g=>g.id!=id);W(d)},
  setUser:async(id,x)=>{const d=L();d.users[id]={...d.users[id],...x};W(d)},
  games:async()=>L().games,
  addGame:async g=>{const d=L();g.id=""+Date.now();d.games.push(g);W(d);return g.id},
  updGame:async(id,x)=>{const d=L();Object.assign(d.games.find(g=>g.id==id),x);W(d)},
  vote:async(id,u,v)=>{const d=L(),g=d.games.find(g=>g.id==id);g.likes=(g.likes||[]).filter(x=>x!=u);g.dislikes=(g.dislikes||[]).filter(x=>x!=u);if(v>0)g.likes.push(u);if(v<0)g.dislikes.push(u);W(d)}};
}

const ov=(id,h)=>{$("#"+id).innerHTML=h?`<div class="ov"><div class="bx">${h}</div></div>`:""};
const ask=(t,f)=>{Y=f;ov("c",`<p>${t}</p><div class="row"><button data-a="yes">Да</button><button class="g" data-a="no">Нет</button></div>`)};
const sc=g=>(g.likes||[]).length-(g.dislikes||[]).length;
const load=async()=>{G=await B.games();BAN=await B.getBan(me.uid)};
const askTime=(t,f)=>{Y=v=>f(+v);ov("c",`<p>${t}</p><select id="tt" style="width:100%;padding:11px;border-radius:10px;background:#1c1c28;color:#fff"><option value="0">Снять</option><option value="3600000">1 час</option><option value="86400000">1 день</option><option value="604800000">7 дней</option><option value="2592000000">30 дней</option><option value="3000000000000">Навсегда</option></select><div class="row"><button data-a="yes">ОК</button><button class="g" data-a="no">Отмена</button></div>`)};

function list(){
 const V=G.filter(g=>!(g.hiddenUntil>Date.now())||adm());
 if(q)return V.filter(g=>g.title.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>sc(b)-sc(a));
 const liked=V.filter(g=>sc(g)>0).sort((a,b)=>sc(b)-sc(a));
 if(liked.length){const n=10,pages=Math.ceil(liked.length/n),d=Math.floor(Date.now()/864e5)%pages;return liked.slice(d*n,d*n+n)} // каждые 24ч новая десятка залайканных
 return V.slice().sort((a,b)=>b.created-a.created); // нет залайканных — показываем старые
}
const feed=()=>list().map(g=>`<section class="card" data-a="open" data-v="${g.id}"><h2>${e(g.title)}</h2><p>👍 ${(g.likes||[]).length} · 👎 ${(g.dislikes||[]).length} · ${e(g.ownerName)}${g.hiddenUntil>Date.now()?" · 🙈 скрыта":""}</p></section>`).join("");

function login(){cur=login;app.innerHTML=`<div class="c"><h1>🎮 Game Hub</h1><p>Привяжи почту Gmail, чтобы войти</p><button class="big" style="max-width:320px" data-a="login">Войти через Gmail</button>${FIREBASE_CONFIG.apiKey?"":"<p style='opacity:.5;font-size:13px'>Демо-режим: данные хранятся только в этом браузере</p>"}</div>`}
function nickV(){app.innerHTML=`<div class="c"><h2>Придумай ник</h2><input id="nn" maxlength="20" placeholder="Ник" style="max-width:320px"><p class="er" id="er"></p><button class="big" style="max-width:320px" data-a="mknick">Продолжить</button></div>`}
function passV(){cur=null;app.innerHTML=`<div class="c"><h2>Пароль администратора</h2><input id="pw" type="password" placeholder="Пароль" style="max-width:320px"><p class="er" id="er"></p><button class="big" style="max-width:320px" data-a="chkpass">Войти</button><button class="g" data-a="outnow">Выйти</button></div>`}
function home(){cur=home;app.innerHTML=`<header><div style="width:90px"></div><input id="q" placeholder="🔍 Поиск игры" value="${e(q)}"><div class="pr"><i data-a="pop">${P.icon}</i><span data-a="prof">${e(P.nick)}</span></div></header><main id="feed">${feed()}</main><footer><button class="big" style="max-width:420px" data-a="up">Загрузить игру</button></footer>`}
function prof(){cur=prof;app.innerHTML=`<header><button data-a="home">←</button><b>Профиль</b><span style="width:60px"></span></header><div class="pg"><div class="ic">${P.icon}</div><h2>${e(P.nick)}</h2><p>${e(me.email)}</p><button data-a="mail">Сменить почту</button><input id="nn" maxlength="20" value="${e(P.nick)}"><button data-a="nick">Сохранить ник</button><p>Иконка:</p><div class="row">${ICONS.map(i=>`<button data-a="icon" data-v="${i}">${i}</button>`).join("")}</div><button class="g" data-a="fs">⛶ Полный экран</button><button class="big" data-a="mine">Мои игры</button><button class="g" data-a="out">Выйти</button></div>`}
function mine(){cur=mine;const my=G.filter(g=>g.owner==me.uid);app.innerHTML=`<header><button data-a="prof">←</button><b>Мои игры</b><span style="width:60px"></span></header><div class="pg">${my.map(g=>`<div class="it"><span>${e(g.title)}</span><button data-a="edit" data-v="${g.id}">+</button></div>`).join("")||"<p style='opacity:.6'>Ты ещё ничего не загрузил</p>"}</div>`}

function form(id){
 if(BAN&&BAN.until>Date.now()){ov("m",`<p>Ты забанен до ${new Date(BAN.until).toLocaleString("ru")}. Загружать игры нельзя.</p><button class="big" data-a="close">OK</button>`);return}
 const g=id&&G.find(x=>x.id==id);
 ov("m",`<div class="top"><button data-a="${id?"xit":"close"}">✕</button></div><h2>${id?"Обновить игру":"Загрузить игру"}</h2><input id="t" placeholder="Название" value="${e(g?g.title:"")}"><label>Файл (.html)<input type="file" id="f" accept=".html,.htm,text/html"></label><textarea id="c0" placeholder="Или напиши код">${e(g?g.code:"")}</textarea><p class="er" id="er"></p>${id?'<button class="g" data-a="clr">Удалить файл или код</button><button class="big" data-a="upd" data-v="'+id+'">Обновить</button><button class="g" data-a="dgame" data-v="'+id+'">Удалить игру</button>':'<button class="big" data-a="save">Загрузить</button>'}`);
}
function check(){
 const t=$("#t").value.trim(),c=$("#c0").value,er=m=>($("#er").textContent=m,false);
 if(!t)return er("Введи название");
 if(!c.trim())return er("Добавь файл или код");
 if(!/<\s*(!doctype|html|head|body|script|canvas|div)/i.test(c))return er("Нужно в .html");
 return{t,c};
}

const A={
 login:()=>B.login(),
 async mknick(){const n=$("#nn").value.trim();if(n.length<2){$("#er").textContent="Минимум 2 символа";return}
  await B.setUser(me.uid,{nick:n,icon:ICONS[0],created:Date.now(),email:me.email});P=await B.getUser(me.uid);go()},
 home:async()=>{await load();home()},prof,mine:async()=>{await load();mine()},
 pop:()=>ov("m",`<p>Аккаунт создан: ${new Date(P.created).toLocaleDateString("ru")}</p><button class="big" data-a="close">OK</button>`),
 close:()=>{ov("m","");cur&&cur()},
 mail:()=>ask("Вы уверены что хотите сменить почту?",()=>B.logout()),
 out:()=>ask("Вы уверены что хотите выйти?",()=>B.logout()),
 fs:()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.(),
 async chkpass(){if(await hash($("#pw").value,AS)!==AH){$("#er").textContent="Неверный пароль";return}sessionStorage.adm="1";go()},
 outnow:()=>B.logout(),
 adel:id=>ask("Удалить игру навсегда?",async()=>{await B.delGame(id);await load();ov("m","");cur()}),
 dgame:id=>ask("Вы уверены что хотите удалить игру?",async()=>{await B.delGame(id);await load();ov("m","");cur()}),
 ahide:id=>askTime("На сколько скрыть игру?",async ms=>{await B.updGame(id,{hiddenUntil:ms?Date.now()+ms:0});await load();ov("m","");cur()}),
 aban:id=>{const g=G.find(x=>x.id==id);askTime("На сколько забанить "+e(g.ownerName)+"? (нельзя загружать игры)",async ms=>{await B.setBan(g.owner,{until:ms?Date.now()+ms:0,name:g.ownerName});ov("m","")})},
 async nick(){const n=$("#nn").value.trim();if(n.length<2)return;await B.setUser(me.uid,{nick:n});P.nick=n;prof()},
 async icon(i){await B.setUser(me.uid,{icon:i});P.icon=i;prof()},
 open(id){const g=G.find(x=>x.id==id),u=me.uid,l=(g.likes||[]).includes(u),d=(g.dislikes||[]).includes(u);
  ov("m",`<h2>${e(g.title)}</h2><button class="big" data-a="play" data-v="${id}">▶ Играть</button><div class="row"><button class="${l?"on":""}" data-a="vote" data-v="${id}|1">👍 Лайк ${(g.likes||[]).length}</button><button class="${d?"on":""}" data-a="vote" data-v="${id}|-1">👎 Дизлайк ${(g.dislikes||[]).length}</button></div>${adm()?`<div class="row"><button class="g" data-a="adel" data-v="${id}">🗑 Удалить</button><button class="g" data-a="ahide" data-v="${id}">🙈 Скрыть</button><button class="g" data-a="aban" data-v="${id}">⛔ Бан автора</button></div>`:""}<button class="g" style="width:100%" data-a="close">Закрыть</button>`)},
 async vote(v){const[id,x]=v.split("|"),g=G.find(k=>k.id==id),u=me.uid,c=(g.likes||[]).includes(u)?1:(g.dislikes||[]).includes(u)?-1:0;
  await B.vote(id,u,c==+x?0:+x);await load();A.open(id)},
 play(id){const g=G.find(x=>x.id==id);ov("m","");const f=document.createElement("div");f.className="play";f.innerHTML='<button data-a="stop">✕</button>';
  const i=document.createElement("iframe");i.sandbox="allow-scripts allow-pointer-lock allow-forms allow-modals";i.allow="fullscreen; autoplay; gamepad";i.allowFullscreen=true;i.srcdoc=g.code;f.append(i);document.body.append(f)},
 stop:()=>$(".play").remove(),
 up:()=>form(),edit:id=>form(id),
 clr:()=>{$("#c0").value="";$("#f").value=""},
 xit:()=>ask("Вы уверены что хотите выйти? Все изменения не сохраняются",()=>ov("m","")),
 async save(){const r=check();if(!r)return;await B.addGame({title:r.t,code:r.c,owner:me.uid,ownerName:P.nick,created:Date.now(),likes:[],dislikes:[]});await load();ov("m","");cur()},
 upd(id){const r=check();if(!r)return;ask("Вы уверены что хотите обновить?",async()=>{await B.updGame(id,{title:r.t,code:r.c});await load();ov("m","");cur()})},
 yes:()=>{const v=$("#tt")?.value;ov("c","");Y&&Y(v)},no:()=>ov("c","")
};
document.addEventListener("click",ev=>{const el=ev.target.closest("[data-a]");if(el)A[el.dataset.a]?.(el.dataset.v)});
document.addEventListener("input",ev=>{if(ev.target.id=="q"){q=ev.target.value;$("#feed").innerHTML=feed()}});
document.addEventListener("change",ev=>{if(ev.target.id!="f")return;const f=ev.target.files[0];if(!f)return;
 if(!/\.html?$/i.test(f.name)){$("#er").textContent="Нужно в .html";ev.target.value="";return}
 $("#er").textContent="";if(!$("#t").value)$("#t").value=f.name.replace(/\.html?$/i,"");f.text().then(t=>$("#c0").value=t)});

B.onAuth(async u=>{ov("m","");ov("c","");
 if(!u){me=null;sessionStorage.removeItem("adm");login();return}
 me=u;P=await B.getUser(u.uid);if(!P){nickV();return}
 go()});
</script></body></html>
