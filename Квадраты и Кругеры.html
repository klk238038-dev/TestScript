<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Квадраты и Кругеры</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{background:#0a0a0a;color:#c8ffc8;font-family:'Courier New',monospace;overflow:hidden;width:100%;height:100%;touch-action:none;overscroll-behavior:none}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;font-size:11px;padding:6px 10px;color:#7dff9a;background:rgba(10,10,10,.85);border-bottom:1px solid #1a2f1a;z-index:5;flex-wrap:wrap;gap:6px}
#hud span{display:flex;align-items:center;gap:4px}
canvas{position:fixed;top:0;left:0;background:#0d0f0d;display:block}
.screen{position:fixed;inset:0;background:rgba(5,8,5,.96);display:none;justify-content:flex-start;align-items:center;flex-direction:column;gap:12px;color:#c8ffc8;z-index:20;text-align:center;padding:60px 20px 100px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.on{display:flex}
.screen h1{font-size:22px;color:#ff9de2;letter-spacing:2px;margin-bottom:4px}
.screen p{font-size:13px;color:#7dff9a;max-width:520px;line-height:1.55}
.screen button{background:#111811;color:#c8ffc8;border:1px solid #2a4a2a;padding:12px 26px;font-family:inherit;font-size:15px;cursor:pointer;border-radius:4px;margin:4px}
.screen button:active{border-color:#4aff4a;background:#1b2f1b}
.screen button.danger{border-color:#5a2a2a;color:#ff9b9b}
.screen button.danger:active{border-color:#ff6b6b;background:#2a1010}
.screen input{padding:10px 14px;background:#111811;color:#c8ffc8;border:1px solid #2a4a2a;font-family:inherit;font-size:15px;border-radius:4px;text-align:center;width:260px}
#menu .logo{font-size:26px;color:#ff9de2;letter-spacing:3px;text-shadow:0 0 14px #ff9de2;margin-bottom:2px}
#menuBook{position:fixed;top:10px;left:10px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#2a4a2a 0%,#0f140f 100%);border:2px solid #7dff9a;color:#ff9de2;font-size:28px;display:none;justify-content:center;align-items:center;cursor:pointer;z-index:25;box-shadow:0 0 14px rgba(125,255,154,0.5)}
#menuBook.on{display:flex}
.coins{color:#ffcc55;font-size:13px;margin:6px 0 14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.coins span{background:#111811;padding:4px 8px;border-radius:4px;border:1px solid #2a4a2a}
.tabs{display:flex;gap:8px;margin:8px 0 14px;border:1px solid #2a4a2a;border-radius:6px;padding:4px;background:#0f140f;flex-wrap:wrap;justify-content:center}
.tab{padding:8px 16px;cursor:pointer;font-size:12px;border-radius:4px;color:#5a7a5a;font-family:inherit;background:transparent;border:none;transition:.15s}
.tab.active{background:#1b2f1b;color:#ff9de2}
.chars{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:900px;margin:10px 0 16px}
.char{width:200px;padding:14px 12px;background:#0f140f;border:1px solid #2a4a2a;border-radius:6px;cursor:pointer;transition:.15s;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.char.selected{border-color:#7dff9a;background:#152615;box-shadow:0 0 16px #2a6f2a inset}
.char.locked{opacity:.65}
.char.locked:hover{border-color:#ff9de2}
.char.main{border-color:#ff9de2}
.char .name{font-size:15px;color:#ff9de2;margin-bottom:6px;text-align:center}
.char .icon{width:54px;height:54px;margin:0 auto 8px;border-radius:8px;border:2px solid #2a4a2a;display:flex;justify-content:center;align-items:center;font-size:26px}
.stats{font-size:11px;color:#7dff9a;line-height:1.55;margin-bottom:8px}
.stats b{color:#c8ffc8}
.price-top{font-size:11px;color:#ffcc55;text-align:center;margin-bottom:8px;font-weight:bold;border-bottom:1px dashed #2a4a2a;padding-bottom:4px}
.ability{font-size:10px;color:#ffcc55;margin-bottom:6px;line-height:1.4;background:rgba(255,204,85,0.05);padding:5px;border-radius:4px;text-align:center}
.quest-txt{font-size:10px;color:#ff9de2;line-height:1.3;padding:4px;border-top:1px dashed #2a4a2a;margin-top:6px;text-align:center}
.quest-done{color:#7dff9a!important}
/* Кругеры */
.krug-list{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:900px;margin:10px 0}
.krug{width:180px;padding:12px 10px;background:#0f140f;border:1px solid #2a4a2a;border-radius:6px;text-align:left}
.krug .name{font-size:14px;color:#ff9de2;margin-bottom:6px;text-align:center}
.krug .icon{width:48px;height:48px;margin:0 auto 8px;border-radius:50%;border:2px solid #2a4a2a;display:flex;justify-content:center;align-items:center;font-size:22px}
.krug .stats{font-size:11px;line-height:1.5;margin-bottom:6px}
.krug .bar{height:8px;background:#000;border:1px solid #2a4a2a;border-radius:4px;overflow:hidden;margin:6px 0}
.krug .bar-fill{height:100%;background:linear-gradient(90deg,#7dff9a,#ff9de2);transition:width 0.3s}
.krug .pct{font-size:10px;color:#7dff9a;text-align:center}
/* Предметы */
.slots{display:flex;gap:12px;margin:8px 0 14px;justify-content:center}
.slot{width:70px;height:70px;border:2px dashed #2a4a2a;border-radius:8px;display:flex;justify-content:center;align-items:center;font-size:28px;color:#3a5a3a;background:#0f140f}
.slot.filled{border-style:solid;border-color:#7dff9a;background:#152615}
.item{width:160px;padding:12px 10px;background:#0f140f;border:1px solid #2a4a2a;border-radius:6px;cursor:pointer;text-align:left}
.item.equipped{border-color:#7dff9a;background:#152615}
.item.locked{opacity:.5}
.item .name{font-size:13px;color:#ff9de2;margin-bottom:4px;text-align:center}
.item .icon{width:42px;height:42px;margin:0 auto 6px;border-radius:6px;border:2px solid #2a4a2a;display:flex;justify-content:center;align-items:center;font-size:20px}
.item .stats{font-size:10px;line-height:1.4}
/* Игра */
#touch{position:fixed;inset:0;pointer-events:none;z-index:3}
#joystick{position:absolute;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(20,40,20,.35);border:1px solid #2a4a2a;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:50%;top:50%;width:52px;height:52px;margin-left:-26px;margin-top:-26px;border-radius:50%;background:radial-gradient(circle,#7dff9a 0%,#2a6f2a 100%);border:1px solid #7dff9a;pointer-events:none}
.btn{position:absolute;border-radius:50%;background:rgba(20,40,20,.5);border:1px solid #2a4a2a;color:#c8ffc8;font-family:inherit;font-size:12px;font-weight:bold;display:flex;justify-content:center;align-items:center;pointer-events:auto;touch-action:none;text-align:center;line-height:1.1;padding:4px;transition:.1s}
.btn:active,.btn.on{background:rgba(40,90,40,.7);border-color:#4aff4a}
.btn.disabled{opacity:.4;border-color:#3a3a3a;color:#5a7a5a}
#btnFix{right:14px;bottom:calc(100px + env(safe-area-inset-bottom,0px));width:76px;height:76px;font-size:12px}
#btnDash{right:calc(14px + 84px);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:64px;height:64px;font-size:11px}
#btnSkill{right:14px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:64px;height:64px;font-size:11px;border-color:#ff9de2;color:#ff9de2;display:none}
#btnSkill.visible{display:flex}
#btnSkill:active,#btnSkill.on{border-color:#ffccff;background:rgba(90,40,90,.7);color:#ffccff}
#btnSkill.cd{opacity:.4;border-color:#3a3a3a;color:#5a7a5a}
#hint{position:fixed;bottom:calc(2px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:10px;color:#3a5a3a;z-index:2;pointer-events:none}
</style>
</head>

<div class="screen" id="charsScreen">
<h1>ПЕРСОНАЖИ</h1>
<div class="coins" id="charsCoins"></div>
<div class="tabs">

<div class="screen" id="krugScreen">
<h1>КРУГЕРЫ</h1>
<p style="font-size:11px;color:#5a7a5a">Изучай кругеров до 100% — получай предметы. Максимум 2 одетых.</p>
<div class="slots">
<div class="slot" id="slot0">＋</div>
<div class="slot" id="slot1">＋</div>
</div>

<div class="chars" id="itemsList"></div>
<button id="btnKrugBack">◀ НАЗАД</button>
</div>

<div class="screen" id="codesScreen">
<h1>КОДЫ</h1>
<p style="font-size:12px">Введи код и нажми «Применить».</p>
<input id="codeInput" placeholder="ВВЕДИ КОД" autocomplete="off">
<button id="btnApplyCode">✅ ПРИМЕНИТЬ</button>
<p style="font-size:11px;color:#5a7a5a;margin-top:10px" id="codeMsg"></p>
<button id="btnCodesBack">◀ НАЗАД</button>
</div>

<div class="screen" id="endScreen"><h1 id="ovTitle">ИГРА ОКОНЧЕНА</h1><p id="ovText"></p><button id="ovRetry">ЗАНОВО</button><button id="ovMenu">В МЕНЮ</button></div>
<div class="screen" id="resetScreen"><h1>СБРОСИТЬ?</h1><p>Все данные будут удалены.</p><button id="resetYes" class="danger">ДА</button><button id="resetNo">◀ ОТМЕНА</button></div>

{id:'mechanic',name:'МЕХАНИК',icon:'⚙️',price:500,color:'#aaaaaa',lives:3,speed:3,dash:4,stamina:2,fix:3,isMain:false,isAdmin:false,passive:'+33% скорости на 10с после починки',active:null,quest:{type:'totalMachines',target:15,label:'Починить 15 машин'}},

// ==================== SAVE ====================
const SAVE_KEY='kvad_krug_v9';
function defaultSave(){return{
 coins:250,unlocked:[],lastChar:null,
 krugerPct:{red:0,purple:0,orange:0,green:0,pink:0,cyan:0,dark:0,yellow:0},
 equipped:[],itemsUnlocked:[],
 totalFloors:0,totalMachines:0,darkFloors:0,bestCards:0,
 codesUsed:[]
}}
function loadSave(){try{const r=localStorage.getItem(SAVE_KEY);if(!r)return defaultSave();const d=JSON.parse(r);const s={...defaultSave(),...d};
if(Array.isArray(s.unlocked))s.unlocked=s.unlocked.filter(id=>CHARACTERS.some(c=>c.id===id));else s.unlocked=[];
if(!s.lastChar||!CHARACTERS.some(c=>c.id===s.lastChar)||!s.unlocked.includes(s.lastChar))s.lastChar=null;
if(!s.krugerPct) s.krugerPct={red:0,purple:0,orange:0,green:0,pink:0,cyan:0,dark:0,yellow:0};
if(s.krugerPct.pink === undefined) s.krugerPct.pink = 0;
if(s.krugerPct.cyan === undefined) s.krugerPct.cyan = 0;
if(s.krugerPct.dark === undefined) s.krugerPct.dark = 0;

function tryBuildFloor(){
 const s=state;
 s.machines=[];s.monsters=[];s.cards=[];s.walls=[];s.bullets=[];s.slimes=[];s.fixedCount=0;
 s.totalMachines=Math.min(8,2+Math.floor(s.floor/2));
 const t=14;
 s.walls.push({x:0,y:0,w:W,h:t});s.walls.push({x:0,y:H-t,w:W,h:t});
 s.walls.push({x:0,y:0,w:t,h:H});s.walls.push({x:W-t,y:0,w:t,h:H});
 const blocks=4+Math.min(8,Math.floor(s.floor/2));
 for(let i=0;i<blocks;i++){
  const bw=50+Math.random()*110,bh=40+Math.random()*90;
  const x=90+Math.random()*Math.max(1,W-180-bw),y=60+Math.random()*Math.max(1,H-120-bh);
  if(x<170&&y>H/2-90&&y<H/2+90)continue;
  if(x+bw>W-100&&y<140)continue;
  s.walls.push({x,y,w:bw,h:bh});
 }
 const liftX=W-60,liftY=60;
 if(isInsideWallRect(liftX,liftY,40,40))return false;
 s.elevator={x:liftX,y:liftY,w:40,h:40};
 const start={x:60,y:H/2};
 let att=0;
 while(s.machines.length<s.totalMachines&&att<500){
  att++;
  const m={x:100+Math.random()*Math.max(1,W-200),y:80+Math.random()*Math.max(1,H-160),r:14,fixed:false,progress:0,needed:1.2+Math.min(3,s.floor*0.1)};
  if(isInsideWall(m.x,m.y,26)||dist(m,start)<130||dist(m,s.elevator)<80)continue;
  if(s.machines.some(o=>dist(o,m)<100))continue;
  s.machines.push(m);
 }
 if(s.machines.length<s.totalMachines)return false;
 
 // ВЫБОР ТИПОВ КРУГЕРОВ
 let pool = KRUGERS.filter(k => {
     if ((k.id === 'pink' || k.id === 'cyan' || k.id === 'dark' || k.id === 'yellow') && s.floor < 5) return false;
     if (k.id === 'orange' && s.floor < 3) return false;
     if (k.id === 'purple' && s.floor < 2) return false;
     return true;
 });
 let typesHere = [];
 for(const k of pool){
     let kChance = k.chance !== undefined ? k.chance : 10;
     if(kChance >= 100 || Math.random() * 100 < kChance){
         typesHere.push(k);
     }
 }
 if(typesHere.length === 0 && pool.length > 0) typesHere.push(pool[0]);
 typesHere = typesHere.slice(0, 3);
 s.krugerTypes = typesHere.map(k => k.id);

 const count=2+Math.min(4,Math.floor(s.floor/2));
 let ma=0;
 while(s.monsters.length<count&&ma<300){
  ma++;
  const type=typesHere[Math.floor(Math.random()*typesHere.length)];
  const mx=130+Math.random()*Math.max(1,W-260),my=90+Math.random()*Math.max(1,H-180);
  if(isInsideWall(mx,my,20)||dist({x:mx,y:my},start)<180)continue;
  s.monsters.push({x:mx,y:my,r:13,typeId:type.id,dir:Math.random()*Math.PI*2,changeT:0,shootCd:1+Math.random()*2,slimeTimer:2});
 }
 
 const mult=selectedChar.id==='scientist'?2:1;
 typesHere.forEach(k=>{
  save.krugerPct[k.id]=Math.min(100,(save.krugerPct[k.id]||0)+5*mult);
  if(save.krugerPct[k.id]>=100&&!save.itemsUnlocked.includes(k.item)){
   save.itemsUnlocked.push(k.item);s.message=`🎁 ПРЕДМЕТ: ${ITEMS.find(i=>i.id===k.item).name}!`;s.messageT=3;
  }
 });
 
 const cardCount=3+Math.floor(Math.random()*3);
 for(let i=0;i<cardCount;i++){
  const cx=100+Math.random()*Math.max(1,W-200),cy=80+Math.random()*Math.max(1,H-160);
  if(isInsideWall(cx,cy,15))continue;
  s.cards.push({x:cx,y:cy,r:10});
 }
 
 if(hasItem('magnet_item') && s.cards.length > 0){
     let gain = selectedChar.id === 'bait' ? 2 : 1;
     if(hasItem('multiplier')) gain *= 2;
     s.cardsVal += s.cards.length * gain;
     s.cards = [];
     s.message = '🧲 МАГНИТ: ВСЕ КАРТЫ СОБРАНЫ';
     s.messageT = 2.5;
 }
 
 s.isDark=s.floor>=2&&Math.random()<0.15;
 s.player.x=start.x;s.player.y=start.y;
 writeSave(save);
 return true;
}
function isInsideWall(x,y,pad=0){for(const w of state.walls)if(x>w.x-pad&&x<w.x+w.w+pad&&y>w.y-pad&&y<w.y+w.h+pad)return true;return false}
function isInsideWallRect(x,y,w,h){for(const wall of state.walls)if(x<wall.x+wall.w&&x+w>wall.x&&y<wall.y+wall.h&&y+h>wall.y)return true;return false}
function tryMove(ent,nx,ny){const r=ent.r;let okX=true,okY=true;for(const w of state.walls){if(circleRectCollide(nx,ent.y,r,w))okX=false;if(circleRectCollide(ent.x,ny,r,w))okY=false}if(okX)ent.x=nx;if(okY)ent.y=ny}
function buildFloor(){for(let i=0;i<40;i++){if(tryBuildFloor())return true}return false}
function teleportDash(p,dirX,dirY,distPx){if(dirX===0&&dirY===0)return false;const steps=12;let lastX=p.x,lastY=p.y;for(let i=1;i<=steps;i++){const nx=p.x+dirX*distPx*(i/steps),ny=p.y+dirY*distPx*(i/steps);let blocked=false;for(const w of state.walls)if(circleRectCollide(nx,ny,p.r,w)){blocked=true;break}if(blocked)break;lastX=nx;lastY=ny}p.x=lastX;p.y=lastY;return true}

function applyItems(stats){
 const s={...stats};
 for(const id of save.equipped){
  const it=ITEMS.find(x=>x.id===id);
  if(!it)continue;
  if(it.effect){
    for(const[k,v] of Object.entries(it.effect)){
        s[k]=(s[k]||0)+v;
    }
  }
 }
 for(const id of save.equipped){
  const it=ITEMS.find(x=>x.id===id);
  if(!it)continue;
  if(it.percent){
    for(const[k,v] of Object.entries(it.percent)){
        let bonus = s[k] * (v / 100);
        s[k] = (s[k]||0) + bonus;
    }
  }
 }
 ['speed','dash','stamina','fix'].forEach(k=>{if(s[k]<1)s[k]=1;if(s[k]>15)s[k]=15});
 if(s.lives<1)s.lives=1;
 return s;
}

function newGame(){
 const c=selectedChar;
 const stats=applyItems({lives:c.lives,speed:c.speed,dash:c.dash,stamina:c.stamina,fix:c.fix});
 state={floor:1,lives:stats.lives,maxLives:stats.lives,cardsVal:0,
  player:{x:60,y:H/2,r:12,baseSpeed:stats.speed,baseDash:stats.dash,staminaMax:stats.stamina,stamina:stats.stamina,fixSpeed:stats.fix,
   dashCd:0,invuln:0,char:c,
   rectBuffT:0,speedMult:1,speedBuffT:0,fixMult:1,fixBuffT:0,
   activeCd:0,magnetPull:0,pendingHpHeal:false,randomStatBuffT:0,randomStatBuff:null,
   mechanicBuffT:0,engineerBuffT:0, engineerStacks: 0, bombUsed:false, staminaDrained: false},
  machines:[],monsters:[],cards:[],bullets:[],walls:[],slimes:[],elevator:null,fixedCount:0,totalMachines:3,
  particles:[],shake:0,message:'',messageT:0,finished:false,isDark:false,krugerTypes:[]};
 $('btnSkill').classList.toggle('visible', !!c.active || c.id === 'stamina_master');
 $('btnSkill').classList.remove('cd');
 buildFloor();
 updateHUD();
}

function nextFloor(){
 if(state.isDark)save.darkFloors++;
 save.totalFloors++;
 state.floor++;
 state.player.stamina=state.player.staminaMax;
 state.player.mechanicBuffT=0;state.player.engineerBuffT=0;
 state.player.engineerStacks=0;
 state.player.staminaDrained = false;
 state.player.speedMult = 1; 
 state.player.speedBuffT = 0; 
 save.coins+=10;writeSave(save);
 state.message=`⬇️ ЭТАЖ ${state.floor} (+10 💰)`;state.messageT=2;
 buildFloor();
 updateHUD();
}

function updateHUD(){
 if(!state)return;
 $('hudFloor').textContent='ЭТАЖ '+state.floor+(state.isDark?' 🌑':'');
 $('hudHP').textContent='♥'+Math.max(0,state.lives);
 $('hudStamina').textContent=`⚡${state.player.stamina}/${state.player.staminaMax}`;
 $('hudMach').textContent=`⚙${state.fixedCount}/${state.totalMachines}`;
 $('hudCards').textContent='🃏'+state.cardsVal;
 $('btnDash').classList.toggle('disabled',state.player.stamina<=0);
 $('btnSkill').classList.toggle('cd',state.player.activeCd>0);
}

function gameOver(){
 state.finished=true;running=false;
 save.bestCards=Math.max(save.bestCards,state.cardsVal);
 writeSave(save);
 $('ovTitle').textContent='💀 ИГРА ОКОНЧЕНА';
 $('ovText').textContent=`Этаж ${state.floor}. Собрано карт: ${state.cardsVal} (лучший: ${save.bestCards})`;
 showScreen('endScreen');
}

function update(dt){
 const s=state;if(s.finished)return;
 const p=s.player,c=p.char;

 let ax=input.ax,ay=input.ay;
 if(keys['a']||keys['arrowleft'])ax-=1;if(keys['d']||keys['arrowright'])ax+=1;
 if(keys['w']||keys['arrowup'])ay-=1;if(keys['s']||keys['arrowdown'])ay+=1;
 const len=Math.hypot(ax,ay);if(len>1){ax/=len;ay/=len}

 let speedStars=p.baseSpeed, fixStars=p.fixSpeed;
 if(c.id==='twin'){
  if(s.floor%2===1){speedStars=1;fixStars=5}
  else{speedStars=5;fixStars=1}
 }
 if(p.rectBuffT>0&&speedStars<5)speedStars=5;
 if(p.mechanicBuffT>0)speedStars*=1.33;
 if(p.engineerBuffT>0) speedStars *= (1 + (p.engineerStacks||1) * 0.25);
 if(p.speedBuffT>0)speedStars*=(p.speedMult||1.15);
 let spd=speedStars*40;

 tryMove(p,p.x+ax*spd*dt,p.y+ay*spd*dt);

 if(p.dashCd>0)p.dashCd-=dt;
 if(p.invuln>0)p.invuln-=dt;
 if(p.rectBuffT>0)p.rectBuffT-=dt;
 if(p.speedBuffT>0){p.speedBuffT-=dt;if(p.speedBuffT<=0)p.speedMult=1;}
 if(p.fixBuffT>0)p.fixBuffT-=dt;
 if(p.mechanicBuffT>0)p.mechanicBuffT-=dt;
 if(p.engineerBuffT>0)p.engineerBuffT-=dt;
 if(p.activeCd>0)p.activeCd-=dt;

 const wantDash=input.dash||keys[' '];
 const dashCostsStamina=c.id!=='dasher';
 if(wantDash&&p.dashCd<=0&&(!dashCostsStamina||p.stamina>0)){
  if(dashCostsStamina){p.stamina--;updateHUD()}
  let dirX=ax,dirY=ay;if(dirX===0&&dirY===0){dirX=1;dirY=0}
  const distPx=(c.id==='dasher'?6:c.dash)*40;
  const sx=p.x,sy=p.y;
  teleportDash(p,dirX,dirY,distPx);
  p.invuln=0.25;
  for(let i=0;i<=14;i++){const t=i/14;s.particles.push({x:sx+(p.x-sx)*t,y:sy+(p.y-sy)*t,vx:(Math.random()-0.5)*40,vy:(Math.random()-0.5)*40,life:0.35,color:'#c47dff'})}
  p.dashCd=1.2;input.dash=false;
 }

 if(input.skill && (c.active || c.id === 'stamina_master') && p.activeCd <= 0){
  activateSkill(c,p);input.skill=false;
 }

 const wantFix=input.fix||keys['e'];
 let near=null;
 for(const m of s.machines)if(!m.fixed&&dist(p,m)<p.r+m.r+14){near=m;break}
 if(near&&wantFix){
  let fm=1;
  if(c.id==='cube'&&s.totalMachines>0)fm=1+(s.fixedCount/Math.max(1,s.totalMachines-1))*0.48;
  if(c.id==='engineer'&&p.fixBuffT>0)fm*=1.75;
  
  // Дебафф от Жёлтого
  let slowDebuff = 1;
  for(const mon of s.monsters){
      if(mon.typeId === 'yellow') slowDebuff = 0.75;
  }
  fm *= slowDebuff;

  near.progress+=dt*(0.6+fixStars*0.2)*fm;
  if(near.progress>=near.needed){
   near.fixed=true;s.fixedCount++;
   save.totalMachines++;
   save.coins+=5;writeSave(save);
   s.message='✅ Машина! +5💰';s.messageT=1.5;
   
   if(c.id==='mechanic'){ p.mechanicBuffT=10; }
   if(c.id==='engineer'){ 
       p.engineerBuffT=10; 
       p.engineerStacks = Math.min(4, (p.engineerStacks||0) + 1); 
   }
   
   if(hasItem('pillow') && p.stamina < p.staminaMax){
       p.stamina++;
       updateHUD();
       s.message = '🛏️ ПОДУШКА: +1 СТАМИНА';
       s.messageT = 1.5;
   }
   
   if(s.fixedCount >= s.totalMachines && hasItem('turbo')){
       p.speedBuffT = 5;
       p.speedMult = 1.5;
       s.message = '🚀 ТУРБО! +50% СКОРОСТИ'; s.messageT = 3;
   }
   const mult=selectedChar.id==='scientist'?2:1;
   s.krugerTypes.forEach(tid=>{
    save.krugerPct[tid]=Math.min(100,(save.krugerPct[tid]||0)+5*mult);
    const kr=KRUGERS.find(k=>k.id===tid);
    if(save.krugerPct[tid]>=100&&!save.itemsUnlocked.includes(kr.item)){
     save.itemsUnlocked.push(kr.item);
     s.message=`🎁 ПРЕДМЕТ: ${ITEMS.find(i=>i.id===kr.item).name}!`;s.messageT=3;
    }
   });
   writeSave(save);
  }
 }else for(const m of s.machines)if(!m.fixed&&m.progress>0)m.progress=Math.max(0,m.progress-dt*0.3);

 for(const mon of s.monsters){
  const kr=KRUGERS.find(k=>k.id===mon.typeId);
  const d=dist(mon,p);
  const visionPx=kr.vision*40;
  let sees=d<visionPx;
  if(c.id==='stamina_master')sees=d<visionPx*0.5;
  let tx=mon.x,ty=mon.y;
  if(kr.ability==='flee'&&d<visionPx){const dx=(mon.x-p.x)/d,dy=(mon.y-p.y)/d;tx+=dx*kr.speed*40*dt;ty+=dy*kr.speed*40*dt}
  else if(sees){const dx=(p.x-mon.x)/d,dy=(p.y-mon.y)/d;tx+=dx*kr.speed*40*dt;ty+=dy*kr.speed*40*dt}
  else{mon.changeT-=dt;if(mon.changeT<=0){mon.dir=Math.random()*Math.PI*2;mon.changeT=1+Math.random()*2}tx+=Math.cos(mon.dir)*kr.speed*20*dt;ty+=Math.sin(mon.dir)*kr.speed*20*dt}
  tryMove(mon,tx,ty);
  
  if(kr.ability==='pull'&&d<visionPx&&d>30){
   const dx=(mon.x-p.x)/d,dy=(mon.y-p.y)/d;
   tryMove(p,p.x+dx*kr.speed*15*dt,p.y+dy*kr.speed*15*dt);
  }
  
  if(kr.ability === 'slime') {
      mon.slimeTimer = (mon.slimeTimer || 0) - dt;
      if(mon.slimeTimer <= 0) {
          mon.slimeTimer = 2;
          s.slimes.push({x: mon.x, y: mon.y, r: 18, life: 5, hit: false});
      }
  }

  if(d<mon.r+p.r&&p.invuln<=0){
   if(c.id==='rect')p.rectBuffT=3;
   
   if(hasItem('bomb') && !p.bombUsed){
       p.bombUsed = true;
       s.message = '💣 БОМБА! СТАН 5С'; s.messageT = 2;
       for(const m of s.monsters){
           if(dist(m, p) < 120) m.stunT = 5;
       }
       for(let i=0;i<15;i++) s.particles.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*300,vy:(Math.random()-0.5)*300,life:0.6,color:'#ff8c00'});
   }

   if(kr.id === 'pink') {
       if(!p.staminaDrained && p.stamina > 0) {
           p.stamina = 0;
           p.staminaDrained = true;
           s.message = '🌸 РОЗОВЫЙ ЗАБРАЛ ВСЮ СТАМИНУ!';
           s.messageT = 2;
           updateHUD();
       } else {
           s.lives -= kr.damage;
           s.message = '🌸 РОЗОВЫЙ УДАРИЛ!';
           s.messageT = 1;
           updateHUD();
       }
   } else {
       s.lives -= kr.damage;
   }

   p.invuln=1.2;s.shake=12;
   if(navigator.vibrate)navigator.vibrate(80);
   for(let i=0;i<10;i++)s.particles.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*160,vy:(Math.random()-0.5)*160,life:0.5,color:'#ff6b6b'});
   
   if(s.lives<=0){gameOver();return}
  }
 }
 s.bullets=s.bullets.filter(b=>{
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  if(dist(b,p)<p.r+b.r&&p.invuln<=0){
   s.lives-=1;p.invuln=1.2;updateHUD();
   if(s.lives<=0){gameOver();return false}
   return false;
  }
  return b.life>0&&b.x>0&&b.x<W&&b.y>0&&b.y<H;
 });
 
 for(let i = s.cards.length - 1; i >= 0; i--){
  const card = s.cards[i];
  if(dist(card, p) < p.r + card.r + 5){
   let gain = c.id === 'bait' ? 2 : 1;
   if(hasItem('multiplier')) gain *= 2;
   s.cardsVal += gain;
   
   if(hasItem('sneakers')){
       p.speedMult = (p.speedMult || 1) + 0.25;
       p.speedBuffT = 4;
   }
   s.message = `🃏 +${gain} карта`;
   s.messageT = 0.6;
   s.cards.splice(i, 1);
  }
 }

 // Урон от лужи
 if(s.slimes) {
     for(let i = s.slimes.length - 1; i >= 0; i--) {
         let sl = s.slimes[i];
         sl.life -= dt;
         if(sl.life <= 0) {
             s.slimes.splice(i, 1);
             continue;
         }
         if(!sl.hit && dist(sl, p) < p.r + sl.r && p.invuln <= 0) {
             sl.hit = true;
             s.lives -= 1; p.invuln = 1.2; updateHUD();
             s.shake = 12; if(navigator.vibrate) navigator.vibrate(80);
             if(s.lives <= 0) { gameOver(); return; }
         }
     }
 }

 const el=s.elevator;
 const nearLift=Math.abs(p.x-(el.x+el.w/2))<34&&Math.abs(p.y-(el.y+el.h/2))<34;
 if(nearLift){
  if(s.fixedCount>=s.totalMachines){
   s.message='⬇️ Лифт: держи ЧИНИТЬ';s.messageT=0.4;
   if(wantFix)nextFloor();
  }else{s.message=`Лифт закрыт: ${s.fixedCount}/${s.totalMachines}`;s.messageT=0.4}
 }
 for(let i=s.particles.length-1;i>=0;i--){const pt=s.particles[i];pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.life-=dt;if(pt.life<=0)s.particles.splice(i,1)}
 if(s.shake>0)s.shake-=dt*40;
 if(s.messageT>0)s.messageT-=dt;
}

function activateSkill(c,p){
 const s=state;
 if(c.id === 'stamina_master') {
    p.stamina = p.staminaMax;
    s.message = '🌀 ПОЛНАЯ СТАМИНА';
    s.messageT = 2;
    p.activeCd = 75;
    updateHUD();
    return;
 }
 if(c.id==='lucky'){const stats=['speed','dash','fix'];const r=stats[Math.floor(Math.random()*3)];p.speedBuffT=10;p.speedMult=1.15;s.message=`🎲 УДАЧА: +15% к ${r}`;s.messageT=2;p.activeCd=25}
 else if(c.id==='sprinter'){p.speedBuffT=5;p.speedMult=1.25;s.message='💨 +25% СКОРОСТЬ';s.messageT=2;p.activeCd=50}
 else if(c.id==='magnet'){
  let closest=null,minD=Infinity;
  for(const m of s.machines)if(!m.fixed){const d=dist(p,m);if(d<minD){minD=d;closest=m}}
  if(closest&&minD<600){p.x=closest.x-30;p.y=closest.y-30;s.message='🧲 ПРИТЯНУТ';s.messageT=1.5;p.activeCd=25}
  else s.message='🧲 Нет машин';s.messageT=1.5;
 }
 else if(c.id==='medic'){
  if(s.cardsVal>=100){
    s.cardsVal-=100;
    s.lives+=1; 
    s.message='🩺 ДОБАВЛЕНО +1 HP (-100 карт)';
    s.messageT=2;p.activeCd=100;updateHUD();
  } else s.message='🩺 Нужно 100 карт';s.messageT=1.5;
 }
 else if(c.id==='pusher'){
  let closest=null,minD=200;
  for(const m of s.monsters){const d=dist(p,m);if(d<minD){minD=d;closest=m}}
  if(closest){
   const dx=closest.x-p.x,dy=closest.y-p.y,dl=Math.hypot(dx,dy)||1;
   tryMove(closest,closest.x+dx/dl*200,closest.y+dy/dl*200);
   s.message='👊 ОТТОЛКНУЛ';s.messageT=1.5;p.activeCd=20;
  }else s.message='👊 Рядом никого';s.messageT=1.5;
 }
 else if(c.id==='healer'){
  if(s.lives >= s.maxLives){
      s.message = '💚 Здоровье полное!';
      s.messageT = 1.5;
  } else {
      s.lives += 1;
      if(s.lives > s.maxLives) s.lives = s.maxLives;
      s.message = '💚 ВОССТАНОВЛЕНО +1 HP';
      s.messageT = 2;p.activeCd = 60;updateHUD();
  }
 }
 else if(c.id==='teleporter'){p.x=s.elevator.x+s.elevator.w/2;p.y=s.elevator.y+s.elevator.h/2;s.message='🌀 К ВЫХОДУ';s.messageT=1.5;p.activeCd=100}
 else if(c.id==='bait'){
    for(const m of s.monsters){m.x=p.x+40;m.y=p.y+40}
    p.invuln = 3; 
    s.message='🎯 ВСЕ СЮДА + НЕУЯЗВИМОСТЬ';s.messageT=2;p.activeCd=40
 }
 else if(c.id==='star'){
  if(s.cardsVal>=75){
    s.cardsVal-=75;
    s.lives+=1; 
    s.message='⭐ ДОБАВЛЕНО +1 HP (-75 карт)';
    s.messageT=2;p.activeCd=150;updateHUD();
  } else s.message='⭐ Нужно 75 карт';s.messageT=1.5;
 }
 else if(c.id==='engineer'){p.fixBuffT=15;s.message='🛠️ +75% ПОЧИНКИ 15с';s.messageT=2;p.activeCd=60}
 updateHUD();
}

// ==================== DRAW ====================
function draw(){
 const s=state;if(!s)return;
 ctx.save();
 if(s.shake>0)ctx.translate((Math.random()-0.5)*s.shake,(Math.random()-0.5)*s.shake);
 ctx.fillStyle='#0d0f0d';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#142614';ctx.lineWidth=1;
 for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(const w of s.walls){ctx.fillStyle='#1b2f1b';ctx.fillRect(w.x,w.y,w.w,w.h);ctx.strokeStyle='#2a4a2a';ctx.strokeRect(w.x+0.5,w.y+0.5,w.w-1,w.h-1)}
 const el=s.elevator,open=s.fixedCount>=s.totalMachines;
 ctx.fillStyle=open?'#1b3f2f':'#1a1a1a';ctx.fillRect(el.x,el.y,el.w,el.h);
 ctx.strokeStyle=open?'#7dff9a':'#3a3a3a';ctx.lineWidth=2;ctx.strokeRect(el.x,el.y,el.w,el.h);
 ctx.fillStyle=open?'#7dff9a':'#4a4a4a';ctx.font='bold 20px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⬇',el.x+el.w/2,el.y+el.h/2+1);
 for(const m of s.machines){
  ctx.fillStyle=m.fixed?'#2a5f2a':'#3a2a10';ctx.strokeStyle=m.fixed?'#7dff9a':'#ffcc55';
  ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fill();ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=m.fixed?'#c8ffc8':'#ffcc55';ctx.font='bold 15px Courier New';ctx.fillText(m.fixed?'✔':'⚙',m.x,m.y+1);
  if(!m.fixed&&m.progress>0){const pct=m.progress/m.needed;ctx.fillStyle='#000';ctx.fillRect(m.x-18,m.y-m.r-11,36,6);ctx.fillStyle='#ffcc55';ctx.fillRect(m.x-18,m.y-m.r-11,36*pct,6)}
 }
 for(const card of s.cards){
  ctx.fillStyle='#ffcc55';ctx.fillRect(card.x-8,card.y-11,16,22);
  ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.strokeRect(card.x-8,card.y-11,16,22);
  ctx.fillStyle='#000';ctx.font='bold 12px Courier New';ctx.fillText('🃏',card.x,card.y);
 }
 
 // Рисуем лужи
 if(s.slimes) {
     for(const sl of s.slimes) {
         ctx.beginPath();
         ctx.arc(sl.x, sl.y, sl.r, 0, Math.PI * 2);
         ctx.fillStyle = 'rgba(50, 0, 50, 0.7)'; 
         ctx.fill();
     }
 }

 for(const pt of s.particles){ctx.globalAlpha=Math.max(0,pt.life*2);ctx.fillStyle=pt.color;ctx.fillRect(pt.x-2,pt.y-2,4,4)}
 ctx.globalAlpha=1;
 for(const mon of s.monsters){
  const kr=KRUGERS.find(k=>k.id===mon.typeId);
  ctx.beginPath();ctx.arc(mon.x,mon.y,mon.r,0,Math.PI*2);
  ctx.fillStyle=kr.color;ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#000';ctx.fillRect(mon.x-5,mon.y-4,4,4);ctx.fillRect(mon.x+2,mon.y-4,4,4);
 }
 for(const b of s.bullets){
  ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.fillStyle='#ff9b9b';ctx.fill();
 }
 const p=s.player;
 if(p.invuln>0&&Math.floor(p.invuln*20)%2===0)ctx.globalAlpha=0.4;
 ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
 const pg=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,p.r);
 pg.addColorStop(0,'#d8b4ff');pg.addColorStop(1,'#4a0a6a');
 ctx.fillStyle=pg;ctx.fill();
 ctx.strokeStyle='#c47dff';ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle='#fff';ctx.fillRect(p.x-4,p.y-3,3,5);ctx.fillRect(p.x+2,p.y-3,3,5);
 ctx.globalAlpha=1;
 ctx.restore();
 
 if(s.isDark){
  const radius=(p.char.id==='lighter'?6:3)*40;
  const grad=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,radius);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(0.7,'rgba(0,0,0,0.5)');
  grad.addColorStop(1,'rgba(0,0,0,1)');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
 }
 
 if(s.messageT>0&&s.message){
  ctx.globalAlpha=Math.min(1,s.messageT*2);
  const mw=Math.min(440,W-40);
  ctx.fillStyle='rgba(10,10,10,0.9)';ctx.fillRect(W/2-mw/2,H-110,mw,30);
  ctx.strokeStyle='#2a4a2a';ctx.lineWidth=1;ctx.strokeRect(W/2-mw/2,H-110,mw,30);
  ctx.fillStyle='#c8ffc8';ctx.font='13px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(s.message,W/2,H-95);
  ctx.globalAlpha=1;
 }
}

function loop(t){
 if(!running)return;
 const dt=Math.min(0.05,(t-lastT)/1000||0);lastT=t;
 update(dt);updateHUD();draw();
 requestAnimationFrame(loop);
}

// ==================== EVENTS ====================
$('btnPlay').onclick=()=>{
 if(!selectedChar){alert('Сначала купи персонажа!');showScreen('charsScreen');renderChars();return}
 if(!save.unlocked.includes(selectedChar.id)){alert('Не куплен!');return}
 showScreen('endScreen');document.querySelectorAll('.screen').forEach(el=>el.classList.remove('on'));
 newGame();running=true;lastT=performance.now();requestAnimationFrame(loop);
};
$('btnChars').onclick=()=>{showScreen('charsScreen');currentTab='normal';document.querySelectorAll('#charsScreen .tab').forEach(t=>t.classList.remove('active'));$('tabNormal').classList.add('active');renderChars()};
$('btnCharsBack').onclick=showMenu;
$('btnCodes').onclick=()=>{showScreen('codesScreen');$('codeInput').value='';$('codeMsg').textContent=''};
$('btnCodesBack').onclick=showMenu;
$('menuBook').onclick=()=>{showScreen('krugScreen');renderKrug()};
$('btnKrugBack').onclick=showMenu;
$('btnReset').onclick=()=>{showScreen('resetScreen')};
$('resetNo').onclick=showMenu;
$('resetYes').onclick=()=>{localStorage.removeItem(SAVE_KEY);save=defaultSave();selectedChar=null;writeSave(save);showMenu()};
$('ovRetry').onclick=()=>{if(!selectedChar){showMenu();return}document.querySelectorAll('.screen').forEach(el=>el.classList.remove('on'));newGame();running=true;lastT=performance.now();requestAnimationFrame(loop)};
$('ovMenu').onclick=showMenu;

showMenu();
ctx.fillStyle='#0d0f0d';ctx.fillRect(0,0,W,H);
</script>
